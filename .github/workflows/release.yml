name: Publish beta
on:
  create:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified beta publicly (false builds only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: beta-release-${{ github.event.ref || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'publish/v'))
    runs-on: windows-2025
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      source: ${{ steps.release.outputs.source }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'create' && github.event.ref || github.ref }}
      - name: Verify deliberate release request
        id: release
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.event.ref }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = [string]([xml](Get-Content Version.props -Raw)).Project.PropertyGroup.Version
          if ($version -notmatch '^[0-9]+[.][0-9]+[.][0-9]+-(beta|rc)[.][0-9]+$') { throw 'A beta/rc version is required.' }
          if ($env:EVENT_NAME -eq 'create' -and $env:RELEASE_REF -ne "publish/v$version") { throw 'Publication branch must match Version.props.' }
          if ($env:EVENT_NAME -eq 'workflow_dispatch' -and $env:DISPATCH_REF -ne 'refs/heads/master') { throw 'Dispatch from master only.' }
          git merge-base --is-ancestor HEAD origin/master
          if ($LASTEXITCODE -ne 0) { throw 'Only reviewed commits on master can be released.' }
          $source = (git rev-parse HEAD).Trim()
          "tag=v$version" | Add-Content $env:GITHUB_OUTPUT
          "source=$source" | Add-Content $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore and audit dependencies
        run: dotnet restore PennCraft.slnx
      - name: Build
        run: dotnet build PennCraft.slnx --no-restore -c Release
      - name: Test
        run: dotnet test PennCraft.slnx --no-build -c Release
      - name: Build and verify packages
        shell: pwsh
        run: ./build/Build-Beta.ps1
      - name: Verify installer lifecycle
        shell: pwsh
        run: ./build/Test-Installer.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: beta-packages
          path: |
            artifacts/beta/*-portable.zip
            artifacts/beta/*-setup.exe
            artifacts/beta/SHA256SUMS.txt
            artifacts/beta/BUILDINFO.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: release-verification
          path: artifacts/test-results/
          if-no-files-found: ignore
          retention-days: 7
  publish:
    needs: build
    if: github.event_name == 'create' || inputs.publish
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build.outputs.source }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: beta-packages
          path: release-assets
      - name: Publish verified prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_SOURCE: ${{ needs.build.outputs.source }}
        run: ./build/Publish-Beta.ps1 -AssetDirectory release-assets -Tag $env:RELEASE_TAG -SourceCommit $env:RELEASE_SOURCE
