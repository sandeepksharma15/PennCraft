name: Build and test

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore PennCraft.slnx
      - name: Build
        run: dotnet build PennCraft.slnx --no-restore -c Release
      - name: Test
        run: dotnet test PennCraft.slnx --no-build -c Release
