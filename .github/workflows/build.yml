name: Build and test
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore and audit dependencies
        run: dotnet restore PennCraft.slnx
      - name: Build
        run: dotnet build PennCraft.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test PennCraft.slnx --no-build --configuration Release
      - name: Build and verify beta packages
        shell: pwsh
        run: ./build/Build-Beta.ps1
      - name: Verify installer lifecycle
        shell: pwsh
        run: ./build/Test-Installer.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: beta-packages
          path: |
            artifacts/beta/*-portable.zip
            artifacts/beta/*-setup.exe
            artifacts/beta/SHA256SUMS.txt
            artifacts/beta/BUILDINFO.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: release-verification
          path: artifacts/test-results/
          if-no-files-found: ignore
          retention-days: 7
