name: Build and test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore PennCraft.slnx
      - name: Build
        run: dotnet build PennCraft.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test PennCraft.slnx --no-build --configuration Release
